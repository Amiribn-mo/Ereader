<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0c0e">
<title>Reader</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Reader","short_name":"Reader","start_url":".","scope":".","display":"standalone","background_color":"%230b0c0e","theme_color":"%230b0c0e","icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png"},{"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0b0c0e;
  --bg2:#121316;
  --bg3:#1a1c20;
  --line:#232529;
  --fg:#d6d8dc;
  --fg-dim:#8b8d96;
  --accent:#8ab4f8;
  --accent-soft:rgba(138,180,248,.07);
  --err:#f2a6a6;
  --fs:20px;
  --mw:760px;
  --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
button{
  background:transparent;
  border:1px solid var(--line);
  color:var(--fg-dim);
  border-radius:6px;
  padding:4px 10px;
  font-size:12px;
  cursor:pointer;
  font-family:inherit;
  white-space:nowrap;
}
button:hover{color:var(--fg);border-color:var(--fg-dim)}
button:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
button.ghost{border:none;color:var(--fg-dim);padding:4px 6px;border-radius:5px}
button.ghost:hover{color:var(--fg);background:var(--bg3)}

#app{display:flex;height:100vh;width:100vw}

#sidebar{
  flex:0 0 300px;
  width:300px;
  background:var(--bg2);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  transition:margin-left .22s ease;
}
#app.hide-side #sidebar{margin-left:-300px}

.sb-head{
  padding:12px 14px 8px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid var(--line);
}
.sb-head h1{
  margin:0;
  font-size:13px;
  font-weight:600;
  color:var(--fg);
  flex:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#toc-wrap{flex:1;overflow-y:auto;overscroll-behavior:contain}
.toc{margin:0;padding:8px 0 16px}
.toc ul{list-style:none;margin:0;padding:0}
.toc summary{
  cursor:pointer;
  padding:6px 14px;
  font-size:13px;
  color:var(--fg-dim);
  user-select:none;
  list-style:none;
}
.toc summary::-webkit-details-marker{display:none}
details.toc-root>summary{color:var(--fg);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding-top:10px}
.toc summary::before{
  content:'▸';
  display:inline-block;
  margin-right:8px;
  font-size:.75em;
  transition:transform .15s ease;
  color:var(--fg-dim);
}
.toc details[open]>summary::before{transform:rotate(90deg)}
.toc a{
  display:block;
  padding:5px 14px 5px 32px;
  font-size:14px;
  line-height:1.45;
  color:var(--fg-dim);
  text-decoration:none;
  border-left:2px solid transparent;
}
.toc li a:hover{color:var(--fg);background:var(--bg3)}
.toc a.active{
  color:var(--accent);
  border-left-color:var(--accent);
  background:var(--accent-soft);
}

.sb-foot{
  padding:8px 10px;
  border-top:1px solid var(--line);
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.sb-foot .spacer{flex:1}
.sb-foot .swatches{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

#reader{flex:1;position:relative;min-width:0;background:var(--bg)}
#btnSidebar{
  position:absolute;left:8px;top:8px;z-index:6;
  font-size:13px;padding:3px 8px;
  opacity:0;pointer-events:none;transition:opacity .15s ease;
}
#app.hide-side #btnSidebar{opacity:.45;pointer-events:auto}
#app.hide-side #btnSidebar:hover{opacity:.95}
#content{
  position:absolute;inset:0;
  overflow-y:auto;
  overscroll-behavior-y:contain;
  padding:9vh 6vw 20vh;
}
.reading{
  max-width:var(--mw);
  margin:0 auto;
  font-size:var(--fs);
  line-height:1.78;
  color:var(--fg);
  word-wrap:break-word;
  overflow-wrap:break-word;
}
#reader.serif .reading{font-family:Georgia,'Times New Roman',serif}
.reading img{max-width:100%;height:auto;border-radius:2px}
.reading svg{max-width:100%}
.reading p{margin:.85em 0}
.reading h1{font-size:1.65em;line-height:1.25;margin:1.2em 0 .5em}
.reading h2{font-size:1.35em;line-height:1.25;margin:1.1em 0 .45em}
.reading h3{font-size:1.15em;line-height:1.3;margin:1em 0 .4em}
.reading h4{font-size:1em;margin:1em 0 .4em}
.reading blockquote{margin:1em 0;padding:.2em 1.2em;border-left:3px solid var(--line);color:var(--fg-dim)}
.reading code,pre{font-family:Consolas,Menlo,monospace;font-size:.88em;background:var(--bg3);border-radius:4px}
.reading code{padding:.1em .35em}
.reading pre{padding:.9em 1em;overflow-x:auto;line-height:1.55}
.reading table{border-collapse:collapse;margin:1em auto}
.reading td,.reading th{border:1px solid var(--line);padding:.45em .8em}
.reading a{color:var(--accent)}
.reading video,.reading audio{max-width:100%}
.reading .footnotes{font-size:.85em;color:var(--fg-dim)}
.reading hr{border:none;border-top:1px solid var(--line);margin:1.6em auto;width:60%}

#zprev,#znext{
  position:absolute;top:0;bottom:0;width:60px;
  display:flex;align-items:center;justify-content:center;
  color:var(--fg-dim);font-size:30px;
  cursor:pointer;user-select:none;
  opacity:0;transition:opacity .15s ease;
  z-index:3;
}
#zprev{left:0}
#znext{right:0}
#zprev:hover,#znext:hover{opacity:.35}
#zprev.active,#znext.active{opacity:.9}

#progress{
  position:absolute;left:0;bottom:0;height:2px;width:0;
  background:var(--accent);opacity:.85;z-index:4;pointer-events:none;
  transition:width .1s linear;
}

#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}

#bottombar{
  display:none;
  position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:20;
  align-items:center;gap:2px;
  padding:4px;
  border:1px solid var(--line);border-radius:18px;
  background:var(--bg2);
  box-shadow:0 4px 18px var(--shadow);
  transition:transform .2s ease,opacity .2s ease;
}
#bottombar button{font-size:17px;line-height:1;padding:9px 12px;border:none;border-radius:11px}
#bottombar button:disabled{opacity:.35}
#bottombar .sep{width:8px}
#bottombar.bar-hidden{transform:translateX(-50%) translateY(160%);opacity:0;pointer-events:none}

#pct{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  z-index:12;
  font-size:11px;color:var(--fg-dim);
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:3px 9px;cursor:pointer;opacity:.85;line-height:1.4;
  font-variant-numeric:tabular-nums;
  user-select:none;-webkit-user-select:none;
  transition:opacity .2s ease;
  white-space:nowrap;
}
#pct:hover{opacity:1;color:var(--fg)}
#pct .caret{font-size:9px}
#seek{
  position:fixed;left:50%;bottom:42px;transform:translateX(-50%);
  z-index:12;display:none;width:min(72vw,420px);
  accent-color:var(--accent);cursor:pointer;
}
#toast{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  z-index:12;
  font-size:12px;color:var(--fg-dim);background:var(--bg2);
  border:1px solid var(--line);border-radius:12px;
  padding:6px 12px;opacity:0;pointer-events:none;
  transition:opacity .25s ease;
  max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1}

.sw{width:20px;height:20px;border-radius:50%;padding:0;border:1px solid var(--line)}
.sw:hover{border-color:var(--fg-dim)}
.sw.active{outline:2px solid var(--accent);outline-offset:1px}

.overlay{
  position:absolute;inset:0;z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);
  text-align:center;
  padding:24px;
}
.overlay.hide{display:none}
#drop{
  cursor:pointer;
}
#drop .frame{
  max-width:460px;
  border:1px dashed var(--line);
  border-radius:14px;
  padding:56px 40px;
  transition:border-color .15s ease;
}
#drop:hover .frame{border-color:var(--fg-dim)}
#drop h2{margin:0 0 8px;font-size:20px;font-weight:600;color:var(--fg)}
#drop p{margin:2px 0 20px;color:var(--fg-dim);font-size:14px}
#drop button{border-color:var(--accent);color:var(--accent);padding:8px 18px;font-size:14px}
#drop button:hover{background:var(--accent-soft);color:var(--fg)}

#loading .spin{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--accent);
  animation:spin 0.9s linear infinite;
  margin-bottom:16px;
}
#loading p{color:var(--fg-dim);font-size:13px;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}
#err{color:var(--err);font-size:14px;max-width:420px;line-height:1.5}
#filerow{display:flex;justify-content:center}

@media (max-width:720px){
  #sidebar{
    position:fixed;left:0;top:0;bottom:0;
    width:min(84vw,320px);
    margin-left:0;
    transform:translateX(-100%);
    transition:transform .22s ease;
    z-index:50;
    box-shadow:0 0 40px var(--shadow);
  }
  body.menu-open #sidebar{transform:translateX(0)}
  #app.hide-side #sidebar{margin-left:0}
  #btnSidebar{display:none}
  #zprev,#znext{width:64px}
  #progress{top:0;bottom:auto}
  #content{padding:5vh 4.5vw calc(30vh + env(safe-area-inset-bottom))}
  #bottombar{display:flex}
  #scrim.show{display:block}
  #pct{bottom:calc(env(safe-area-inset-bottom) + 78px)}
  #seek{bottom:calc(env(safe-area-inset-bottom) + 106px)}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <button class="ghost" id="btnHide" title="Hide chapters (t)" aria-label="Hide chapters">‹</button>
      <h1 id="bookTitle">Reader</h1>
    </div>
    <div id="toc-wrap">
      <nav class="toc" id="toc" aria-label="Chapters"></nav>
    </div>
    <div class="sb-foot">
      <button id="btnOpen" title="Open a different EPUB">Open</button>
      <div class="swatches" id="swatches" aria-label="Color themes"></div>
      <button class="ghost" id="btnSerif" title="Toggle serif / sans">Aa</button>
      <button class="ghost" id="btnFontMinus" title="Smaller text (-)">A−</button>
      <button class="ghost" id="btnFontPlus" title="Larger text (+)">A+</button>
      <span class="spacer"></span>
      <button id="btnFull" title="Fullscreen (f)" aria-label="Toggle fullscreen">⛶</button>
    </div>
  </aside>

  <div id="reader">
    <button class="ghost" id="btnSidebar" title="Show chapters (t)" aria-label="Show chapters">☰</button>
    <div id="content"></div>
    <div id="zprev" title="Previous chapter (←)">‹</div>
    <div id="znext" title="Next chapter (→)">›</div>
    <div id="progress"></div>
    <div id="pct" title="Jump to position">0%<span class="caret"> ⌄</span></div>
    <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Seek position">
    <div id="toast" aria-live="polite"></div>

    <nav id="bottombar" aria-label="Reading controls">
      <button id="barToc" aria-label="Chapters" aria-expanded="false">☰</button>
      <button id="barPrev" aria-label="Previous chapter">‹</button>
      <button id="barNext" aria-label="Next chapter">›</button>
      <span class="sep"></span>
      <button id="barTheme" title="Change color theme (p)" aria-label="Change color theme">☀</button>
      <button id="barFull" aria-label="Toggle fullscreen">⛶</button>
    </nav>

    <div id="scrim"></div>

    <div id="drop" class="overlay">
      <div class="frame">
        <h2>Drop an EPUB to start reading</h2>
        <p>Your book never leaves this device.</p>
        <div id="filerow"><button id="btnChoose">Choose a file</button></div>
      </div>
    </div>

    <div id="loading" class="overlay hide">
      <div class="spin"></div>
      <p id="loadingText">Opening your book…</p>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".epub,application/epub+zip" hidden>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function(){
'use strict';

if(typeof JSZip === 'undefined'){
  var dp=document.getElementById('drop');
  if(dp){
    var perr=document.createElement('p');
    perr.id='err';
    perr.textContent='Could not load the EPUB library. Check your connection and reload.';
    dp.querySelector('.frame').appendChild(perr);
  }
}

var $=function(s){return document.querySelector(s);};
var els={
  app:$('#app'), sidebar:$('#sidebar'), toc:$('#toc'), title:$('#bookTitle'),
  content:$('#content'), progress:$('#progress'), drop:$('#drop'), loading:$('#loading'),
  loadingText:$('#loadingText'), fileInput:$('#fileInput'), btnOpen:$('#btnOpen'),
  btnFull:$('#btnFull'), btnFontMinus:$('#btnFontMinus'), btnFontPlus:$('#btnFontPlus'),
  btnSerif:$('#btnSerif'), btnHide:$('#btnHide'), btnChoose:$('#btnChoose'), btnSidebar:$('#btnSidebar'),
  swatches:$('#swatches'),
  scrim:$('#scrim'), bottombar:$('#bottombar'),
  pct:$('#pct'), seek:$('#seek'), toast:$('#toast'),
  barToc:$('#barToc'), barPrev:$('#barPrev'), barNext:$('#barNext'), barTheme:$('#barTheme'), barFull:$('#barFull'),
  zprev:$('#zprev'), znext:$('#znext')
};

var book=null;
var chapters=[];
var memory={};
var current=-1;
var menuOpen=false;
var lastScrollY=0;

var settings={fontPx:20,serif:false,sidebar:true,theme:'dark'};

var LS_SETTINGS='reader.settings';
var LS_POS='reader.position';

function parse(text,type){return new DOMParser().parseFromString(text,type);}

function byTag(root,name){
  if(!root) return [];
  return Array.prototype.filter.call(root.getElementsByTagName('*'),function(n){
    return n.localName===name;
  });
}

function dirOf(p){
  var i=p.lastIndexOf('/');
  if(i===-1) return '';
  return p.slice(0,i);
}

function splitFrag(href){
  var i=href.indexOf('#');
  return {path:i===-1?href:href.slice(0,i),frag:i===-1?'':href.slice(i+1)};
}

function resolvePath(base,rel){
  if(base==null) base='';
  var seg=base.split('/').filter(Boolean);
  if(rel.charAt(0)==='/') seg=[];
  var parts=rel.split('/');
  for(var i=0;i<parts.length;i++){
    var s=parts[i];
    if(s===''||s==='.') continue;
    if(s==='..'){seg.pop();continue;}
    var d;
    try{d=decodeURIComponent(s);}catch(e){d=s;}
    seg.push(d);
  }
  return seg.join('/');
}

function loadSettings(){
  try{
    var raw=JSON.parse(localStorage.getItem(LS_SETTINGS));
    if(raw) settings=raw;
  }catch(e){}
  var ok=false;
  for(var i=0;i<THEMES.length;i++) if(THEMES[i].key===settings.theme) ok=true;
  if(!ok) settings.theme='dark';
  applySettings();
  buildSwatches();
}

var THEMES=[
  {key:'dark',name:'Dark',scheme:'dark',
   bg:'#0b0c0e',bg2:'#121316',bg3:'#1a1c20',line:'#232529',
   fg:'#d6d8dc',fdim:'#8b8d96',accent:'#8ab4f8',soft:'rgba(138,180,248,.07)',
   err:'#f2a6a6',shadow:'rgba(0,0,0,.35)'},
  {key:'paper',name:'Paper',scheme:'light',
   bg:'#f7f2e7',bg2:'#efe8da',bg3:'#e6decb',line:'#d8cfbc',
   fg:'#27241d',fdim:'#6f685a',accent:'#8a6434',soft:'rgba(138,100,52,.10)',
   err:'#a03a2e',shadow:'rgba(90,60,20,.18)'},
  {key:'sepia',name:'Sepia',scheme:'light',
   bg:'#f1e9d5',bg2:'#e9dfc6',bg3:'#dccfa9',line:'#d3c69d',
   fg:'#423a2b',fdim:'#8d8368',accent:'#b0742f',soft:'rgba(176,116,47,.10)',
   err:'#a03a2e',shadow:'rgba(90,60,20,.18)'},
  {key:'midnight',name:'Midnight',scheme:'dark',
   bg:'#0b1020',bg2:'#121a30',bg3:'#1b2540',line:'#28345a',
   fg:'#cfd8ee',fdim:'#8fa0c5',accent:'#7aa2f7',soft:'rgba(122,162,247,.08)',
   err:'#f2a6a6',shadow:'rgba(0,0,10,.45)'},
  {key:'forest',name:'Forest',scheme:'dark',
   bg:'#0d1410',bg2:'#141d17',bg3:'#1e2b22',line:'#2c3d30',
   fg:'#d3e3d0',fdim:'#9cb49a',accent:'#7ec98c',soft:'rgba(126,201,140,.08)',
   err:'#f2a6a6',shadow:'rgba(0,10,5,.4)'},
  {key:'ember',name:'Ember',scheme:'dark',
   bg:'#201613',bg2:'#291c17',bg3:'#372a21',line:'#4a3528',
   fg:'#e7d8c9',fdim:'#c2a68c',accent:'#ff9a66',soft:'rgba(255,154,102,.09)',
   err:'#ffb0a0',shadow:'rgba(10,0,0,.4)'}
];

function themeOf(k){
  for(var i=0;i<THEMES.length;i++) if(THEMES[i].key===k) return THEMES[i];
  return THEMES[0];
}

function applyTheme(){
  var t=themeOf(settings.theme);
  var s=document.documentElement.style;
  s.setProperty('--bg',t.bg);
  s.setProperty('--bg2',t.bg2);
  s.setProperty('--bg3',t.bg3);
  s.setProperty('--line',t.line);
  s.setProperty('--fg',t.fg);
  s.setProperty('--fg-dim',t.fdim);
  s.setProperty('--accent',t.accent);
  s.setProperty('--accent-soft',t.soft);
  s.setProperty('--err',t.err);
  s.setProperty('--shadow',t.shadow);
  s.colorScheme=t.scheme;
  els.barTheme.textContent=t.scheme==='light'?'☀':'☾';
  var tc=document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute('content',t.bg);
  var sws=els.swatches?els.swatches.querySelectorAll('.sw'):null;
  for(var i=0;sws&&i<sws.length&&i<THEMES.length;i++){
    sws[i].classList.toggle('active',THEMES[i].key===settings.theme);
  }
}

function setTheme(key){
  settings.theme=key;
  applySettings();
}

function toggleTheme(){
  var idx=0;
  for(var i=0;i<THEMES.length;i++) if(THEMES[i].key===settings.theme){idx=i;break;}
  settings.theme=THEMES[(idx+1)%THEMES.length].key;
  applySettings();
}

function buildSwatches(){
  if(!els.swatches) return;
  els.swatches.innerHTML='';
  for(var i=0;i<THEMES.length;i++){
    (function(t){
      var b=document.createElement('button');
      b.className='sw';
      b.title=t.name;
      b.setAttribute('aria-label','Color theme: '+t.name);
      b.style.background='linear-gradient(135deg,'+t.bg2+' 50%,'+t.accent+' 50%)';
      b.style.borderColor=t.line;
      b.addEventListener('click',function(){setTheme(t.key);});
      els.swatches.appendChild(b);
    })(THEMES[i]);
  }
  applyTheme();
}

function applySettings(){
  document.documentElement.style.setProperty('--fs',Math.round(settings.fontPx)+'px');
  els.content.parentElement.classList.toggle('serif',!!settings.serif);
  els.app.classList.toggle('hide-side',!settings.sidebar);
  if(!isMobile()&&els.sidebar) els.sidebar.style.pointerEvents=settings.sidebar?'':'none';
  applyTheme();
  try{
    localStorage.setItem(LS_SETTINGS,JSON.stringify(settings));
  }catch(e){}
}

function saveSettings(){
  applySettings();
}

function isMobile(){
  return window.matchMedia('(max-width:720px)').matches;
}

function setMenu(open){
  menuOpen=open;
  document.body.classList.toggle('menu-open',open);
  els.scrim.classList.toggle('show',open);
  els.sidebar.style.pointerEvents=open?'auto':'none';
  els.sidebar.setAttribute('aria-hidden',open?'false':'true');
  els.barToc.setAttribute('aria-expanded',open?'true':'false');
}

function setLoading(msg,show){
  if(show!==false) els.loading.classList.remove('hide');
  if(msg!=null) els.loadingText.textContent=msg;
}

function hideLoading(){
  els.loading.classList.add('hide');
}

function showError(msg){
  hideLoading();
  els.drop.classList.remove('hide');
  var old=els.drop.querySelector('#err');
  if(old) old.remove();
  var p=document.createElement('p');
  p.id='err';
  p.textContent=msg;
  els.drop.querySelector('.frame').appendChild(p);
}

var DB='reader-kb';
var STORE='files';
function idb(){
  return new Promise(function(resolve,reject){
    var r=indexedDB.open(DB,1);
    r.onupgradeneeded=function(){r.result.createObjectStore(STORE);};
    r.onsuccess=function(){resolve(r.result);};
    r.onerror=function(){reject(r.error);};
  });
}
function saveEpub(buf){
  try{
    idb().then(function(db){
      db.transaction(STORE,'readwrite').objectStore(STORE).put(buf,'last');
      db.close();
    }).catch(function(){});
  }catch(e){}
}
function loadLastEpub(){
  return idb().then(function(db){
    return new Promise(function(resolve,reject){
      var r=db.transaction(STORE).objectStore(STORE).get('last');
      r.onsuccess=function(){resolve(r.result);db.close();};
      r.onerror=function(){db.close();reject(r.error);};
    });
  }).catch(function(){return null;});
}

async function parsePackage(zip){
  var cfRaw=null;
  var zipFiles=Object.keys(zip.files);
  for(var i=0;i<zipFiles.length;i++){
    if(/container\.xml$/i.test(zipFiles[i])){cfRaw=zip.file(zipFiles[i]);break;}
  }
  if(!cfRaw) throw new Error('Not a valid EPUB (container.xml not found).');
  var cdoc=parse(await cfRaw.async('string'),'application/xml');
  var root=byTag(cdoc,'rootfile')[0];
  if(!root) throw new Error('Not a valid EPUB (no rootfile).');
  var opfRel=root.getAttribute('full-path')||'';
  if(opfRel.charAt(0)==='/') opfRel=opfRel.slice(1);
  var opfDir=dirOf(opfRel);
  var opfEntry=zip.file(opfRel);
  if(!opfEntry) throw new Error('Not a valid EPUB (package file missing).');
  var od=parse(await opfEntry.async('string'),'application/xml');

  var itemsById={};
  var mtEl=byTag(od,'manifest')[0];
  var mItems=byTag(mtEl,'item');
  for(var i=0;i<mItems.length;i++){
    var it=mItems[i];
    var id=it.getAttribute('id');
    var href=it.getAttribute('href')||'';
    itemsById[id]={
      id:id,
      href:href,
      mt:(it.getAttribute('media-type')||'').toLowerCase(),
      props:(it.getAttribute('properties')||'').split(/\s+/),
      path:resolvePath(opfDir,href)
    };
  }

  var spineEl=byTag(od,'spine')[0];
  var tocId=spineEl?spineEl.getAttribute('toc'):null;
  var spine=[];
  if(spineEl){
    var refs=byTag(spineEl,'itemref');
    for(var i=0;i<refs.length;i++){
      var item=itemsById[refs[i].getAttribute('idref')];
      if(item) spine.push({id:item.id,path:item.path,mt:item.mt});
    }
  }
  if(spine.length===0) throw new Error('Not a valid EPUB (empty spine).');

  var title='Untitled';
  var metaEl=byTag(od,'metadata')[0];
  if(metaEl){
    var tEl=byTag(metaEl,'title')[0];
    if(tEl&&tEl.textContent) title=tEl.textContent.trim();
  }

  return {zip:zip,itemsById:itemsById,spine:spine,opfDir:opfDir,tocId:tocId,title:title};
}

async function prepareAssets(pkg){
  var assetUrl={};
  var jobs=[];
  var ids=Object.keys(pkg.itemsById);
  for(var i=0;i<ids.length;i++){
    var it=pkg.itemsById[ids[i]];
    if(/^(image|font|audio|video)\//.test(it.mt)||/\.svg$/i.test(it.path)){
      (function(key){
        var z=pkg.zip.file(key);
        if(z){
          jobs.push(z.async('blob').then(function(b){
            assetUrl[key]=URL.createObjectURL(b);
          }).catch(function(){}));
        }
      })(it.path);
    }
  }
  await Promise.all(jobs);
  pkg.assetUrl=assetUrl;
}

async function resolveCss(cssText,inDir,pkg){
  var out=cssText;
  var importRE=/@import\s+(?:url\(\s*)?['"]?([^'"()\s]+)['"]?\s*\)?/gi;
  var m;
  while((m=importRE.exec(cssText))){
    var p=resolvePath(inDir,m[1]);
    var e=pkg.zip.file(p);
    if(e){
      var sub=await resolveCss(await e.async('string'),dirOf(p),pkg);
      out=out.replace(m[0],sub);
    }
  }
  out=out.replace(/url\(\s*(['"]?)([^'"()\s]+)\1\s*\)/gi,function(mm,q,u){
    var p=resolvePath(inDir,u);
    return 'url("'+(pkg.assetUrl[p]||u)+'")';
  });
  return out;
}

function makeFrag(d){
  var frag=document.createDocumentFragment();
  var nodeList=d.body?d.body.childNodes:(d.childNodes||[]);
  var arr=[];
  for(var i=0;i<nodeList.length;i++) arr.push(nodeList[i]);
  for(var i=0;i<arr.length;i++) frag.appendChild(arr[i]);
  return frag;
}

function scanTitle(d){
  var el=d.querySelector('h1,h2,h3,h4');
  return el&&el.textContent?el.textContent.trim():null;
}

async function prepareChapters(pkg){
  var out=[];
  var chapterByPath={};
  for(var i=0;i<pkg.spine.length;i++) chapterByPath[pkg.spine[i].path]=i;
  pkg.chapterByPath=chapterByPath;

  for(var i=0;i<pkg.spine.length;i++){
    var s=pkg.spine[i];
    var z=pkg.zip.file(s.path);
    if(!z) continue;
    var text=await z.async('string');
    var d=parse(text,'text/html');
    var kills=d.querySelectorAll('base,script');
    for(var k=0;k<kills.length;k++) kills[k].remove();

    var styleTexts=[];
    var links=d.querySelectorAll('link');
    for(var l=0;l<links.length;l++){
      var link=links[l];
      var rel=(link.getAttribute('rel')||'').toLowerCase();
      var href=link.getAttribute('href');
      if(rel.indexOf('stylesheet')!==-1&&href){
        var p=resolvePath(pkg.opfDir,href);
        var ez=pkg.zip.file(p);
        if(ez){
          try{
            styleTexts.push(await resolveCss(await ez.async('string'),dirOf(p),pkg));
          }catch(e){}
        }
      }
      link.remove();
    }
    var styles=d.querySelectorAll('style');
    for(var st=0;st<styles.length;st++) styleTexts.push(styles[st].textContent||'');

    var imgs=d.querySelectorAll('img');
    for(var ii=0;ii<imgs.length;ii++){
      var src=imgs[ii].getAttribute('src');
      var ip=imgs[ii].getAttribute('srcset');
      if(src){
        var p2=resolvePath(pkg.opfDir,src);
        imgs[ii].setAttribute('src',pkg.assetUrl[p2]||src);
      }
      if(ip){
        var tokens=ip.split(',');
        var parts=[];
        for(var a=0;a<tokens.length;a++){
          var bits=tokens[a].trim().split(/\s+/);
          if(!bits[0]) continue;
          var p3=resolvePath(pkg.opfDir,bits[0]);
          var use=pkg.assetUrl[p3]||bits[0];
          parts.push(bits.length>1?use+' '+bits[1]:use);
        }
        if(parts.length) imgs[ii].setAttribute('srcset',parts.join(', '));
      }
    }

    var svgImgs=d.querySelectorAll('image');
    for(var si=0;si<svgImgs.length;si++){
      var sv=svgImgs[si];
      var href=sv.getAttribute('href')||sv.getAttributeNS('http://www.w3.org/1999/xlink','href');
      if(!href) continue;
      var p4=resolvePath(pkg.opfDir,href);
      if(pkg.assetUrl[p4]){
        sv.setAttribute('href',pkg.assetUrl[p4]);
        sv.setAttributeNS('http://www.w3.org/1999/xlink','href',pkg.assetUrl[p4]);
      }
    }

    var sources=d.querySelectorAll('source');
    for(var so=0;so<sources.length;so++){
      var ss=sources[so].getAttribute('src');
      if(!ss) continue;
      sources[so].setAttribute('src',pkg.assetUrl[resolvePath(pkg.opfDir,ss)]||ss);
    }

    var anchors=d.querySelectorAll('a[href]');
    for(var ai=0;ai<anchors.length;ai++){
      var a=anchors[ai];
      var h=a.getAttribute('href');
      if(!h||h===''||h.charAt(0)==='#') continue;
      if(/^(https?:|mailto:|tel:)/i.test(h)) continue;
      var sp=splitFrag(h);
      var p5=resolvePath(pkg.opfDir,sp.path);
      var ci=chapterByPath[p5];
      if(ci!=null){
        a.setAttribute('href','#g-'+ci+(sp.frag?('-f-'+encodeURIComponent(sp.frag)):''));
      }else if(pkg.assetUrl[p5]){
        a.setAttribute('href',pkg.assetUrl[p5]);
      }
    }

    var title=scanTitle(d);
    var frag=makeFrag(d);
    out.push({
      index:i,
      path:s.path,
      title:title,
      styles:styleTexts.join('\n'),
      frag:frag
    });
    await new Promise(function(r){setTimeout(r,0);});
  }
  return out;
}

function child(parent,name){
  var kids=parent.children||[];
  for(var i=0;i<kids.length;i++){
    if(kids[i].localName===name) return kids[i];
  }
  return null;
}

function navElChildren(parent){
  var kids=(parent.children||[]);
  var out=[];
  for(var i=0;i<kids.length;i++) out.push(kids[i]);
  return out;
}

function firstLink(el){
  var kids=el.children;
  for(var i=0;i<kids.length;i++){
    if(kids[i].localName==='a') return kids[i];
  }
  for(var i=0;i<kids.length;i++){
    if(kids[i].localName!=='ol'&&kids[i].children&&kids[i].children.length){
      var r=firstLink(kids[i]);
      if(r) return r;
    }
  }
  return null;
}

function labelOf(el){
  var span=child(el,'span')||child(el,'div');
  if(span&&span.children&&span.children.length===0) return span.textContent.trim();
  return null;
}

function parseNavOl(pkg,ol,opfDir){
  var nodes=[];
  var lis=navElChildren(ol);
  for(var i=0;i<lis.length;i++){
    var li=lis[i];
    if(li.localName!=='li') continue;
    var a=firstLink(li);
    var subOl=child(li,'ol');
    var node={title:(a?(a.textContent||'') : (labelOf(li)||'')),index:undefined,frag:'',children:[]};
    if(a){
      var href=a.getAttribute('href');
      if(href&&href.charAt(0)!=='#'){
        var sp=splitFrag(href);
        var idx=pkg.chapterByPath[resolvePath(opfDir,sp.path)];
        if(idx!=null){node.index=idx;node.frag=sp.frag;}
      }
    }
    node.title=(node.title||'').trim();
    if(subOl) node.children=parseNavOl(pkg,subOl,opfDir);
    nodes.push(node);
  }
  return nodes;
}

async function buildToc(pkg){
  var tree=null;

  var navItem=null;
  var ids=Object.keys(pkg.itemsById);
  for(var i=0;i<ids.length;i++){
    var it=pkg.itemsById[ids[i]];
    if(it.props.indexOf('nav')!==-1){navItem=it;break;}
  }
  if(navItem){
    var navEntry=pkg.zip.file(navItem.path);
    if(navEntry){
      var nd=parse(await navEntry.async('string'),'text/html');
      var navEl=nd.querySelector('nav[epub\\:type="toc"],nav[role="doc-toc"]')||(nd.querySelector('nav')||null);
      if(navEl){
        var ol=null;
        var kids=navEl.children;
        for(var j=0;j<kids.length;j++){
          if(kids[j].localName==='ol'){ol=kids[j];break;}
        }
        if(!ol) ol=navEl.querySelector('ol');
        if(ol){
          tree=parseNavOl(pkg,ol,pkg.opfDir);
        }
      }
    }
  }

  if(!tree&&pkg.tocId&&pkg.itemsById[pkg.tocId]){
    var ncxEntry=pkg.zip.file(pkg.itemsById[pkg.tocId].path);
    if(ncxEntry){
      var xdoc=parse(await ncxEntry.async('string'),'application/xml');
      var navMap=byTag(xdoc,'navMap')[0];
      if(navMap){
        (function walk(parent,out){
          var direct=[];
          var childrenArr=parent.childNodes?Array.prototype.slice.call(parent.childNodes):[];
          for(var i=0;i<childrenArr.length;i++){
            if(childrenArr[i].localName==='navPoint') direct.push(childrenArr[i]);
          }
          for(var i=0;i<direct.length;i++){
            var np=direct[i];
            var label='';
            var lblEl=byTag(np,'text')[0];
            if(lblEl) label=lblEl.textContent.trim();
            var node={title:label,index:undefined,frag:'',children:[]};
            var contentEl=byTag(np,'content')[0];
            if(contentEl){
              var href=contentEl.getAttribute('src')||'';
              var sp=splitFrag(href);
              var idx=pkg.chapterByPath[resolvePath(pkg.opfDir,sp.path)];
              if(idx!=null){node.index=idx;node.frag=sp.frag;}
            }
            walk(np,node.children);
            out.push(node);
          }
        })(navMap,tree=[]);
      }
    }
  }

  if(!tree) tree=[];

  var used={};
  (function mark(nodes){
    for(var i=0;i<nodes.length;i++){
      if(nodes[i].index!=null) used[nodes[i].index]=true;
      mark(nodes[i].children);
    }
  })(tree);

  var missing=[];
  for(var i=0;i<pkg.spine.length;i++){
    if(!used[i]) missing.push({title:null,index:i,frag:'',children:[]});
  }
  if(missing.length){
    tree.push({title:'Other sections',open:false,index:undefined,frag:'',children:missing});
  }

  return tree;
}

function renderToc(tree){
  els.toc.innerHTML='';
  var ul=document.createElement('ul');
  var wrap=document.createElement('details');
  wrap.className='toc-root';
  wrap.open=true;
  var sum=document.createElement('summary');
  sum.textContent='Chapters';
  var rootUl=document.createElement('ul');

  (function build(parentUl,nodes,depth){
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      if(n.children&&n.children.length){
        var det=document.createElement('details');
        det.open=(n.open!==false);
        var s=document.createElement('summary');
        s.textContent=(n.title||'Section');
        var sub=document.createElement('ul');
        build(sub,n.children,depth+1);
        det.appendChild(s);
        det.appendChild(sub);
        parentUl.appendChild(det);
      }else{
        var li=document.createElement('li');
        var a=document.createElement('a');
        if(n.index!=null){
          a.href='#g-'+n.index;
          a.textContent=(n.title||('Chapter '+(n.index+1)));
          li.appendChild(a);
          parentUl.appendChild(li);
        }
      }
    }
  })(rootUl,tree,0);

  applyOpenDefaults(rootUl);

  wrap.appendChild(sum);
  wrap.appendChild(rootUl);
  ul.appendChild(wrap);
  els.toc.appendChild(ul);
  book.anchorByIndex={};
  var links=els.toc.querySelectorAll('a');
  for(var i=0;i<links.length;i++){
    var m=/^#g-(\d+)/.exec(links[i].getAttribute('href')||'');
    if(m) book.anchorByIndex[+m[1]]=links[i];
  }
}

function applyOpenDefaults(rootUl){
  var details=rootUl.querySelectorAll(':scope > details');
  var groupCount=details.length;
  if(groupCount>5){
    for(var i=2;i<details.length;i++) details[i].removeAttribute('open');
  }
}

function showTitles(tree,chs){
  (function walk(nodes){
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      if(n.index==null&&n.title==null&&n.children.length===0){
        n.title='·';
      }
      if(n.index!=null&&!n.title){
        var ch=chs[n.index];
        if(ch&&ch.title) n.title=ch.title;
        else n.title='Chapter '+(n.index+1);
      }
      walk(n.children);
    }
  })(tree);
}

function setActiveChapter(idx){
  var prev=els.toc.querySelector('a.active');
  if(prev) prev.classList.remove('active');
  var a=book.anchorByIndex[idx];
  if(a){
    a.classList.add('active');
    var el=a.parentElement;
    while(el&&el!==els.toc){
      if(el.tagName==='DETAILS') el.setAttribute('open','');
      el=el.parentElement;
    }
  }
}

var endShown=false;
var toastTimer=null;
function toast(msg){
  els.toast.textContent=msg;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){els.toast.classList.remove('show');},2200);
}

function jumpTo(p){
  p=Math.max(0,Math.min(1,p));
  var total=chapters.length;
  var idx=Math.min(total-1,Math.floor(p*total));
  var frac=p*total-idx;
  renderChapter(idx);
  var apply=function(){
    var sc=els.content;
    var h=sc.scrollHeight-sc.clientHeight;
    sc.scrollTop=Math.max(0,Math.min(h,frac*h));
    updateProgress();
  };
  if('requestAnimationFrame' in window){requestAnimationFrame(apply);}
  else{apply();}
}

function toggleSeek(){
  var show=els.seek.style.display==='none'||!els.seek.style.display;
  els.seek.style.display=show?'block':'none';
  if(show) updateProgress();
}

function updateProgress(){
  var sc=els.content;
  var total=chapters.length;
  var frac=(sc.scrollHeight-sc.clientHeight)>0?sc.scrollTop/(sc.scrollHeight-sc.clientHeight):0;
  frac=Math.max(0,Math.min(1,frac));
  var rank=total>0?(current+frac)/total:0;
  var pct=Math.round(rank*100);
  els.progress.style.width=(Math.max(0.004,pct))+'%';
  sc.dataset.fraction=frac.toFixed(4);
  els.pct.textContent=pct+'%';
  els.seek.value=Math.round(rank*1000);
  if(current===total-1&&frac>0.97){
    if(!endShown){endShown=true;toast('· The End ·');}
  }else{
    endShown=false;
  }
}

var scrollRAF=null;
function onScroll(){
  if(scrollRAF) return;
  var sc=els.content;
  if(isMobile()){
    var delta=sc.scrollTop-lastScrollY;
    if(delta>26&&!menuOpen) els.bottombar.classList.add('bar-hidden');
    else if(delta<0) els.bottombar.classList.remove('bar-hidden');
    lastScrollY=sc.scrollTop;
  }
  scrollRAF=requestAnimationFrame(function(){
    scrollRAF=null;
    updateProgress();
    if(current>=0){
      memory[current]=els.content.scrollTop;
      persistPosition();
    }
  });
}

function persistPosition(){
  try{
    localStorage.setItem(LS_POS,JSON.stringify({last:current,scroll:memory,font:settings.fontPx,serif:settings.serif}));
  }catch(e){}
}

function renderChapter(idx,anchor){
  var ch=chapters[idx];
  if(!ch) return;
  current=idx;
  els.content.innerHTML='';
  var wrap=document.createElement('article');
  wrap.className='reading';
  if(ch.styles){
    var st=document.createElement('style');
    st.textContent=ch.styles;
    wrap.appendChild(st);
  }
  wrap.appendChild(ch.frag.cloneNode(true));
  els.content.appendChild(wrap);

  setActiveChapter(idx);
  if(isMobile()&&menuOpen) setMenu(false);
  els.bottombar.classList.remove('bar-hidden');

  var title=(ch.title||('Chapter '+(idx+1)));
  document.title=book.title+' — '+title;
  els.title.textContent=book.title;
  if(chapters.length>1) toast((idx+1)+' / '+chapters.length+' · '+title);

  var after=function(){
    if(anchor){
      var el=els.content.querySelector('#'+CSS.escape(anchor));
      if(el){el.scrollIntoView({block:'start'});return;}
    }
    els.content.scrollTop=(memory[idx]||0);
    updateProgress();
  };

  if('requestAnimationFrame' in window){requestAnimationFrame(after);}
  else{after();}
  updateEdge();
}

function handleAnchor(h){
  var m=/^#g-(\d+)(?:-f-(.+))?$/.exec(h);
  if(!m) return;
  var idx=+m[1];
  var frag=m[2]?decodeURIComponent(m[2]):'';
  if(current===idx&&frag){
    els.content.scrollTop=0;
    var el=els.content.querySelector('#'+CSS.escape(frag));
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});}
    return;
  }
  renderChapter(idx,frag);
}

function nextChapter(dir){
  var i=current+dir;
  if(i<0||i>=chapters.length) return;
  renderChapter(i);
}

function updateEdge(){
  els.zprev.classList.toggle('active',current>0);
  els.znext.classList.toggle('active',current>=0&&current<chapters.length-1);
  if(els.barPrev) els.barPrev.disabled=current<=0;
  if(els.barNext) els.barNext.disabled=current<0||current>=chapters.length-1;
}

function toggleFullscreen(){
  var doc=document;
  var de=doc.documentElement;
  if(doc.fullscreenElement||doc.webkitFullscreenElement){
    if(doc.exitFullscreen) doc.exitFullscreen();
    else if(doc.webkitExitFullscreen) doc.webkitExitFullscreen();
  }else{
    if(de.requestFullscreen) de.requestFullscreen();
    else if(de.webkitRequestFullscreen) de.webkitRequestFullscreen();
  }
}

async function openEpub(ab){
  setLoading('Opening your book…');
  els.drop.classList.add('hide');
  els.content.innerHTML='';
  els.toc.innerHTML='';
  current=-1;
  memory={};
  try{
    var zip=await JSZip.loadAsync(ab);
    var pkg=await parsePackage(zip);
    await prepareAssets(pkg);
    chapters=await prepareChapters(pkg);
    if(chapters.length===0) throw new Error('No readable content found in this EPUB.');
    var tree=await buildToc(pkg);
    showTitles(tree,chapters);
    book={title:pkg.title,anchorByIndex:[]};
    renderToc(tree);

    els.title.textContent=pkg.title;
    document.title=pkg.title;
    hideLoading();

    applySettings();

    var start=0;
    try{
      var pos=JSON.parse(localStorage.getItem(LS_POS));
      if(pos&&pos.last!=null&&pos.last>=0&&pos.last<chapters.length){
        start=pos.last;
        memory=pos.scroll||{};
      }
    }catch(e){}
    var want=-1;
    var hm=/^#g-(\d+)(?:-f-(.+))?$/.exec(location.hash||'');
    if(hm) want=+hm[1];
    renderChapter(want>=0?want:start);
    updateEdge();
    persistPosition();
  }catch(err){
    console.error(err);
    showError(err&&err.message?err.message:'Could not open that file.');
    els.title.textContent='Reader';
    document.title='Reader';
  }
}

function onFile(file){
  if(!file) return;
  var fr=new FileReader();
  fr.onload=function(){
    var ab=fr.result;
    saveEpub(ab);
    openEpub(ab);
  };
  fr.onerror=function(){showError('Could not read that file.');};
  fr.readAsArrayBuffer(file);
}

function initEvents(){
  els.btnOpen.addEventListener('click',function(){els.fileInput.click();});
  els.btnChoose.addEventListener('click',function(){els.fileInput.click();});
  els.fileInput.addEventListener('change',function(){
    if(els.fileInput.files&&els.fileInput.files[0]) onFile(els.fileInput.files[0]);
    els.fileInput.value='';
  });

  els.drop.addEventListener('click',function(e){
    if(e.target.closest('#btnChoose')) return;
    els.fileInput.click();
  });

  window.addEventListener('dragover',function(e){e.preventDefault();});
  els.drop.addEventListener('dragover',function(e){e.preventDefault();});
  els.drop.addEventListener('drop',function(e){
    e.preventDefault();
    var f=e.dataTransfer&&e.dataTransfer.files[0];
    if(f) onFile(f);
  });

  els.btnHide.addEventListener('click',function(){
    if(isMobile()){setMenu(false);return;}
    settings.sidebar=false;
    applySettings();
  });
  els.btnSidebar.addEventListener('click',function(){
    if(isMobile()){setMenu(true);return;}
    settings.sidebar=true;
    applySettings();
  });

  els.btnFontMinus.addEventListener('click',function(){adjustFont(-1);});
  els.btnFontPlus.addEventListener('click',function(){adjustFont(1);});
  els.btnSerif.addEventListener('click',function(){settings.serif=!settings.serif;applySettings();});
  els.btnFull.addEventListener('click',toggleFullscreen);

  els.barToc.addEventListener('click',function(){setMenu(!menuOpen);});
  els.barPrev.addEventListener('click',function(){nextChapter(-1);});
  els.barNext.addEventListener('click',function(){nextChapter(1);});
  els.barTheme.addEventListener('click',toggleTheme);
  els.barFull.addEventListener('click',toggleFullscreen);
  els.scrim.addEventListener('click',function(){setMenu(false);});

  els.pct.addEventListener('click',toggleSeek);
  els.seek.addEventListener('input',function(){
    els.pct.textContent=Math.round((els.seek.value/els.seek.max)*100)+'%';
  });
  els.seek.addEventListener('change',function(){
    toggleSeek();
    jumpTo(els.seek.value/els.seek.max);
  });
  els.seek.addEventListener('keydown',function(e){
    if(e.key==='Escape') toggleSeek();
  });

  els.zprev.addEventListener('click',function(){nextChapter(-1);});
  els.znext.addEventListener('click',function(){nextChapter(1);});

  els.content.addEventListener('scroll',onScroll);
  window.addEventListener('resize',function(){updateProgress();});

  els.content.addEventListener('click',function(e){
    var a=e.target.closest?e.target.closest('a[href]'):null;
    if(!a){
      if(isMobile()&&menuOpen===false){
        var sel=window.getSelection();
        if(!sel||!sel.toString()){
          els.bottombar.classList.toggle('bar-hidden');
        }
      }
      return;
    }
    var h=a.getAttribute('href');
    if(h&&h.charAt(0)==='#'&&/^#g-\d/.test(h)){
      e.preventDefault();
      handleAnchor(h);
      return;
    }
    if(h&&/^blob:|^data:/i.test(h)){
      e.preventDefault();
      var w=window.open(h,'_blank');
      if(!w){location.href=h;}
      return;
    }
    if(h&&(h.charAt(0)=='#'||h==='')) return;
    e.preventDefault();
  });

  document.addEventListener('keydown',function(e){
    var t=e.target;
    if(e.target===els.seek&&e.key==='Escape'){toggleSeek();return;}
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA')) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key;
    if(k==='ArrowRight'){e.preventDefault();nextChapter(1);}
    else if(k==='ArrowLeft'){e.preventDefault();nextChapter(-1);}
    else if(k==='g'||k==='G'){toggleSeek();}
    else if(k==='f'||k==='F'){toggleFullscreen();}
    else if(k==='t'||k==='T'){
      if(isMobile()){setMenu(!menuOpen);}
      else{settings.sidebar=!settings.sidebar;applySettings();}
    }
    else if(k==='+'||k==='='){adjustFont(1);}
    else if(k==='-'){adjustFont(-1);}
    else if(k==='p'||k==='P'){toggleTheme();}
  });

  document.addEventListener('fullscreenchange',updateEdge);
  document.addEventListener('webkitfullscreenchange',updateEdge);
  window.addEventListener('hashchange',function(){
    var hm=/^#g-(\d+)(?:-f-(.+))?$/.exec(location.hash||'');
    if(hm) handleAnchor(location.hash);
  });
}

function adjustFont(d){
  settings.fontPx=Math.max(13,Math.min(34,settings.fontPx+d));
  applySettings();
}

async function boot(){
  loadSettings();
  initEvents();
  applySettings();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  if(isMobile()){setMenu(false);lastScrollY=els.content.scrollTop;}
  var buf=await loadLastEpub();
  if(buf){
    openEpub(buf);
  }else{
    updateEdge();
  }
}

boot();
})();
</script>
</body>
</html>
